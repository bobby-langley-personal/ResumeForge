name: E2E Tests

on:
  # Run after every push to main — gives production a minute to deploy first
  push:
    branches: [main]
  # Nightly against production
  schedule:
    - cron: '0 6 * * *'
  # Manual trigger — optionally override the target URL
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL (defaults to production)'
        required: false
        default: 'https://easy-apply.ai'

jobs:
  e2e-public:
    name: Public tests (no auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run public E2E tests
        run: npx playwright test --project=public
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://easy-apply.ai' }}
          CI: true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-public
          path: playwright-report/
          retention-days: 7

  e2e-authenticated:
    name: Authenticated tests
    runs-on: ubuntu-latest
    # Only run if test credentials are configured
    if: ${{ vars.E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run auth setup
        run: npx playwright test --project=auth
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://easy-apply.ai' }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          CI: true

      - name: Run authenticated E2E tests
        run: npx playwright test --project=authenticated
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://easy-apply.ai' }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          CI: true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authenticated
          path: playwright-report/
          retention-days: 7
